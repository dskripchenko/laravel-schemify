# GitLab CI — mirrors .github/workflows/tests.yml
# Matrix: PHP 8.2–8.5 × Laravel 11/12/13 (excluding 8.2 × 13), Postgres service.

stages:
  - qa
  - test

variables:
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

cache:
  key: composer
  paths:
    - .composer-cache/

# Install PHP extensions + Composer on the official php:*-cli image.
.install: &install
  - apt-get update -yqq && apt-get install -yqq --no-install-recommends git unzip libpq-dev libonig-dev
  - docker-php-ext-install -j"$(nproc)" pdo_pgsql mbstring > /dev/null
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

# ---------------------------------------------------------------------------
# Static analysis + code style (latest supported Laravel, no database).
# ---------------------------------------------------------------------------
qa:
  stage: qa
  image: php:8.3-cli
  before_script:
    - *install
    - composer update --prefer-dist --no-progress
  script:
    - vendor/bin/pint --test
    - vendor/bin/phpstan analyse --no-progress --no-ansi --memory-limit=1G

# ---------------------------------------------------------------------------
# Test matrix.
# ---------------------------------------------------------------------------
test:
  stage: test
  image: php:${PHP}-cli
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: schemify_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SCHEMIFY_TEST_DB_HOST: postgres
    SCHEMIFY_TEST_DB_PORT: "5432"
    SCHEMIFY_TEST_DB_DATABASE: schemify_test
    SCHEMIFY_TEST_DB_USERNAME: postgres
    SCHEMIFY_TEST_DB_PASSWORD: postgres
  parallel:
    matrix:
      - PHP: "8.2"
        LARAVEL: ["11", "12"]
      - PHP: ["8.3", "8.4", "8.5"]
        LARAVEL: ["11", "12", "13"]
  before_script:
    - *install
    - |
      case "$LARAVEL" in
        11) TESTBENCH="^9.0" ;;
        12) TESTBENCH="^10.0" ;;
        13) TESTBENCH="^11.0" ;;
      esac
    - composer require "laravel/framework:^${LARAVEL}.0" --no-update
    - composer require "orchestra/testbench:${TESTBENCH}" --dev --no-update
    # Laravel 11 is past its security-fix window; allow resolving it anyway
    # (compatibility check for existing L11 apps, not an endorsement).
    - if [ "$LARAVEL" = "11" ]; then composer config policy.advisories.block false; fi
    - composer update --prefer-dist --no-progress
  script:
    - vendor/bin/phpunit
